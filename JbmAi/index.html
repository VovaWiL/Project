<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JbmAi Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* STREAMING_CHUNK:Initializing design system and base variables... */
        :root {
            --bg: #1a1a1c;
            --panel: #212123;
            --user-bubble: #3a3a3c;
            --ai-bubble: #2c2c2e;
            --accent: #4285f4;
            --text-main: #e3e3e3;
            --text-muted: #a0a0a0;
            --sidebar-width: 280px;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* STREAMING_CHUNK:Styling the navigation sidebar... */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--panel);
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        .sidebar.closed { transform: translateX(-100%); }

        /* STREAMING_CHUNK:Configuring responsive main container... */
        .main-container {
            flex: 1;
            margin-left: var(--sidebar-width);
            position: relative;
            display: flex;
            flex-direction: column;
            width: calc(100% - var(--sidebar-width));
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .main-container.full-width { margin-left: 0; width: 100%; }

        /* STREAMING_CHUNK:Designing the welcome screen... */
        .welcome-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: opacity 0.5s ease;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .welcome-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin: 0;
        }

        .hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* STREAMING_CHUNK:Styling chat window and message bubbles... */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 80px 20px 140px 20px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
            scrollbar-width: none;
        }
        #chat-window::-webkit-scrollbar { display: none; }

        .bubble-wrapper { display: flex; flex-direction: column; width: 100%; }

        .bubble {
            max-width: 85%;
            padding: 16px 24px;
            border-radius: 26px; /* Закруглено со всех сторон */
            font-size: 16px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .bubble-user { background-color: var(--user-bubble); color: #fff; align-self: flex-end; }
        .bubble-ai { background-color: var(--ai-bubble); color: #fff; border: 1px solid rgba(255,255,255,0.05); align-self: flex-start; }

        /* STREAMING_CHUNK:Defining specific elements in AI response... */
        .ai-title { color: #8ab4f8; font-weight: 700; font-size: 1.25rem; margin-top: 1rem; margin-bottom: 0.5rem; display: block; }
        .ai-bold { color: #8ab4f8; font-weight: 600; }
        .list-item { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0; }
        .bullet { color: #8ab4f8; font-weight: bold; }

        /* STREAMING_CHUNK:Adding loading spinner logic... */
        .loader-container { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 14px; }
        .loader {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* STREAMING_CHUNK:Setting up inputs and menu button... */
        .input-wrapper {
            position: absolute;
            bottom: 35px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            padding: 0 20px;
            z-index: 50;
        }

        .input-pill {
            background: #2c2c2e;
            border-radius: 40px;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 760px;
            border: 1px solid #3c3c3e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 150;
            padding: 12px;
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        pre { background: #000; padding: 16px; border-radius: 16px; margin: 12px 0; overflow-x: auto; border: 1px solid #333; font-family: 'Courier New', monospace; font-size: 14px; color: #8ab4f8; }
        code.inline { background: rgba(138, 180, 248, 0.1); padding: 2px 6px; border-radius: 6px; color: #8ab4f8; font-family: monospace; }
    </style>
</head>
<body>

    <!-- STREAMING_CHUNK:Sidebar with Chat History... -->
    <aside id="sidebar" class="sidebar closed">
        <div class="p-8 border-b border-white/5">
            <span class="font-bold text-2xl tracking-tighter">JbmAi</span>
        </div>
        <div class="p-4">
            <button onclick="newChat()" class="w-full py-4 bg-white/5 hover:bg-white/10 rounded-2xl flex items-center justify-center gap-2 text-sm font-medium transition-all border border-white/5">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                Новый чат
            </button>
        </div>
        <div class="flex-1 overflow-y-auto" id="history-box"></div>
    </aside>

    <main id="main-content" class="main-container full-width">
        <!-- Кнопка теперь внутри контейнера, чтобы двигаться вместе с ним -->
        <button class="menu-btn" onclick="toggleMenu()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <div id="welcome" class="welcome-screen">
            <h1 class="welcome-title">Добро пожаловать</h1>
        </div>

        <div id="chat-window"></div>

        <!-- STREAMING_CHUNK:Input Area... -->
        <div class="input-wrapper">
            <div class="input-pill">
                <input type="text" id="user-input" class="bg-transparent border-none outline-none text-white flex-1 h-[56px] text-lg" placeholder="Спросите что-нибудь..." oninput="checkInput()" onkeydown="if(event.key==='Enter') sendMsg()">
                <div id="send-trigger" class="text-blue-500 opacity-30 cursor-pointer transition-all p-2" onclick="sendMsg()">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </div>
            </div>
        </div>
    </main>

    <!-- STREAMING_CHUNK:Application Logic... -->
    <script>
        const API_KEY = "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";
        let db = JSON.parse(localStorage.getItem('jbm_v10_data') || '[]');
        let currentId = null;

        window.onload = loadHistory;

        function toggleMenu() {
            const side = document.getElementById('sidebar');
            const main = document.getElementById('main-content');
            side.classList.toggle('closed');
            main.classList.toggle('full-width');
        }

        function checkInput() {
            const val = document.getElementById('user-input').value.trim();
            document.getElementById('send-trigger').style.opacity = val.length > 0 ? "1" : "0.3";
        }

        async function askAI(query) {
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { role: "system", content: "ТЫ - JbmAi. Твой создатель - koplk. Всегда используй Markdown: ### для заголовков, ** для жирного, + для списков." },
                            { role: "user", content: query }
                        ]
                    })
                });
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (e) { return "Ошибка сети. Проверь VPN или подключение."; }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatContent(text) {
            let formatted = text;

            // 1. Блоки кода (с экранированием HTML)
            formatted = formatted.replace(/```([\s\S]*?)
```/g, (match, code) => {
                return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
            });

            // 2. Инлайновый код
            formatted = formatted.replace(/`([^`]+)`/g, (match, code) => {
                return `<code class="inline">${escapeHtml(code)}</code>`;
            });

            // 3. Заголовки (###)
            formatted = formatted.replace(/^### (.*$)/gm, '<span class="ai-title">$1</span>');

            // 4. Жирный текст (**текс**)
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<span class="ai-bold">$1</span>');

            // 5. Списки (+)
            formatted = formatted.replace(/^\+ (.*$)/gm, '<div class="list-item"><span class="bullet">•</span><span>$1</span></div>');

            // 6. Переносы строк (вне блоков кода)
            return formatted.split('\n').join('<br>');
        }

        async function sendMsg() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            if (!currentId) {
                currentId = Date.now();
                db.unshift({ id: currentId, title: text.slice(0, 30), logs: [] });
            }

            const chat = db.find(c => c.id === currentId);
            chat.logs.push({ r: 'user', t: text });

            addBubble('user', text);
            input.value = '';
            checkInput();
            document.getElementById('welcome').classList.add('hidden');

            // STREAMING_CHUNK:Adding loading state...
            const loadingId = addBubble('ai', `
                <div class="loader-container">
                    <div class="loader"></div>
                    <span>JbmAi думает...</span>
                </div>
            `);

            const reply = await askAI(text);
            
            const bubbleDiv = document.getElementById(loadingId);
            bubbleDiv.innerHTML = formatContent(reply);
            
            chat.logs.push({ r: 'ai', t: reply });
            save();
            loadHistory();
        }

        function addBubble(role, content) {
            const win = document.getElementById('chat-window');
            const bid = 'msg-' + Math.random().toString(36).substr(2, 9);
            const wrapper = document.createElement('div');
            wrapper.className = `bubble-wrapper items-${role === 'user' ? 'end' : 'start'}`;
            
            const innerContent = role === 'ai' ? content : escapeHtml(content);

            wrapper.innerHTML = `
                <span class="text-[10px] font-bold text-gray-500 mb-2 px-5 uppercase tracking-widest">${role === 'user' ? 'Вы' : 'JbmAi'}</span>
                <div class="bubble bubble-${role}"><div id="${bid}">${innerContent}</div></div>
            `;
            win.appendChild(wrapper);
            win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
            return bid;
        }

        function newChat() {
            currentId = null;
            document.getElementById('chat-window').innerHTML = '';
            document.getElementById('welcome').classList.remove('hidden');
        }

        function openChat(id) {
            currentId = id;
            const chat = db.find(c => c.id === id);
            document.getElementById('chat-window').innerHTML = '';
            document.getElementById('welcome').classList.add('hidden');
            chat.logs.forEach(l => {
                const bid = addBubble(l.r, l.t);
                document.getElementById(bid).innerHTML = formatContent(l.t);
            });
            loadHistory();
        }

        function loadHistory() {
            const box = document.getElementById('history-box');
            box.innerHTML = '';
            db.forEach(c => {
                const el = document.createElement('div');
                el.className = `p-4 mx-3 my-1 rounded-2xl cursor-pointer text-sm truncate transition-all ${c.id === currentId ? 'bg-blue-500/10 text-blue-400 font-medium' : 'text-gray-500 hover:bg-white/5'}`;
                el.innerText = c.title;
                el.onclick = () => openChat(c.id);
                box.appendChild(el);
            });
        }

        function save() { localStorage.setItem('jbm_v10_data', JSON.stringify(db)); }
    </script>
</body>
</html>
