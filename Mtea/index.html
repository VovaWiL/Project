<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>???</title>
    <style>
       
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Courier New", Courier, monospace; 
            text-align: center;
            padding-top: 50px;
        }

        .quest-img {
            max-width: 300px;
            border: 1px dashed #333; 
            margin-bottom: 30px;
        }

        input[type="text"] {
            background-color: #111;
            color: #00ff00;
            border: 2px solid #555;
            padding: 10px;
            font-size: 18px;
            width: 250px;
            outline: none;
            font-family: inherit;
        }

       
        button {
            background-color: #222;
            color: #fff;
            border: 2px solid #555;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            font-family: inherit;
            margin-left: 5px;
        }

        button:hover {
            background-color: #00ff00;
            color: #000;
        }

       
        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <img src="img/secret.png" class="quest-img" alt="тут что-то должно быть">

    <br><br>

    <div>
        <label style="display:block; margin-bottom: 10px; color: #888;">веди ответ:</label>
        <input type="text" id="answerInput" placeholder="..." autocomplete="off">
        <button onclick="checkAnswer()">ОК</button>
    </div>

    <div id="result"></div>

    <script>
       
        function encodeSafe(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode('0x' + p1);
            }));
        }

        function checkAnswer() {
      
            var userAnswer = document.getElementById("answerInput").value.trim().toLowerCase();
            var resultDiv = document.getElementById("result");

            if (!userAnswer) return;

            var userSecret = encodeSafe(userAnswer);

      
            var sys_key_1 = "0L/RgNC40LLQtdGC";
            var sys_key_2 = "0L/RgNC40LLQtdGCIQ=="; 

          
            if (userSecret === sys_key_1 || userSecret === sys_key_2) {
                resultDiv.style.color = "#00ff00"; 
                resultDiv.innerHTML = "ДОГАДАЛСЯ. Отправь скрин мне в личку.";
            } else if (userAnswer === "белый" || userAnswer === "пусто" || userAnswer === "ничего") {
                resultDiv.style.color = "#ff0000"; 
                resultDiv.innerHTML = "Глаза тебя обманывают. Картинка говорит тебе здраствуй, но ты её не слышишь.";
            } else {
                resultDiv.style.color = "#ff0000";
                resultDiv.innerHTML = "НЕВЕРНО.";
            }
        }
    </script>

</body>
</html>
