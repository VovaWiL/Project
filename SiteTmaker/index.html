<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>No-Code Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="flex h-screen bg-dark text-gray">
        <!-- Левая панель иконок -->
        <div class="sidebar-icons">
            <button id="toggle-library" title="Блоки">➕</button>
            <button id="export-json" title="JSON">⚙️</button>
        </div>

        <!-- Библиотека компонентов -->
        <div id="library" class="panel library-panel">
            <h3>Блоки</h3>
            <div id="comp-list"></div>
        </div>

        <!-- Основная область -->
        <div class="main-area">
            <div class="toolbar">
                <div class="mode-switcher">
                    <button class="mode-btn active" data-mode="edit">ДИЗАЙН</button>
                    <button class="mode-btn" data-mode="scripts">СКРИПТЫ</button>
                    <button class="mode-btn" data-mode="preview">ПРЕВЬЮ</button>
                </div>
            </div>
            
            <div id="canvas-container" class="canvas-container">
                <!-- Холст для дизайна -->
                <div id="canvas" class="design-canvas"></div>
                <!-- Холст для скриптов (скрыт по умолчанию) -->
                <div id="scripts-area" class="scripts-canvas hidden"></div>
            </div>
        </div>

        <!-- Правая панель свойств -->
        <div id="properties" class="panel properties-panel">
            <h3>Параметры</h3>
            <div id="prop-fields">Выберите объект</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
