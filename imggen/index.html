<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIMATE - AI Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        
        .bold-text {
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .timate-input {
            background-color: #141414;
            border: 1px solid #222;
            color: white;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
        }
        .timate-input:focus {
            border-color: #007bff;
            outline: none;
            background-color: #181818;
        }
        .timate-button {
            background-color: #007bff;
            color: white;
            transition: all 0.2s;
            font-weight: 800;
        }
        .timate-button:hover {
            background-color: #006ce7;
        }
        .timate-button:active {
            transform: scale(0.97);
        }
        .loader {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .result-box {
            max-height: 220px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        .result-box::-webkit-scrollbar {
            width: 4px;
        }
        .result-box::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }
        
        .main-card {
            background-color: #0d0d0d;
            border: 1px solid #1a1a1a;
        }
    </style>
</head>
<body class="p-4">

    <!-- Header -->
    <div class="mb-4 text-center flex-shrink-0">
        <h1 class="text-5xl bold-text mb-1 text-white uppercase select-none">TIMATE</h1>
        <p class="text-zinc-500 text-[12px] font-bold tracking-tight">Интеллектуальная генерация графики</p>
    </div>

    <div class="max-w-lg w-full main-card p-6 rounded-2xl shadow-2xl flex-shrink-0">
        
        <!-- Prompt Input -->
        <div class="space-y-1.5 mb-3">
            <label class="text-[12px] font-extrabold text-zinc-400 ml-1">Что создать?</label>
            <textarea id="prompt" rows="2" 
                class="w-full timate-input rounded-xl p-3.5 text-[14px] placeholder-zinc-800 resize-none"
                placeholder="Опишите идею и нажмите Enter..."></textarea>
        </div>

        <!-- Size Selection -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="space-y-1.5">
                <label class="text-[12px] font-extrabold text-zinc-400 ml-1">Ширина</label>
                <input type="number" id="width" value="1024" 
                    class="w-full timate-input rounded-xl p-2.5 text-[14px]">
            </div>
            <div class="space-y-1.5">
                <label class="text-[12px] font-extrabold text-zinc-400 ml-1">Высота</label>
                <input type="number" id="height" value="1024" 
                    class="w-full timate-input rounded-xl p-2.5 text-[14px]">
            </div>
        </div>

        <!-- Generate Button -->
        <button id="genBtn" onclick="generateImage()" 
            class="w-full timate-button py-3.5 rounded-xl flex items-center justify-center gap-3 text-[15px] mb-2">
            <span id="btnText">Сгенерировать</span>
            <div id="btnLoader" class="loader hidden"></div>
        </button>

        <!-- Error Messages -->
        <div id="errorArea" class="text-red-500 text-[11px] font-bold text-center hidden py-2 px-4 border border-red-900/30 rounded-lg bg-red-950/10 mb-2"></div>

        <!-- Result Display -->
        <div id="resultArea" class="hidden border-t border-zinc-900 pt-3 mt-1">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] text-zinc-500 font-extrabold uppercase">Результат</span>
                <button onclick="copyToClipboard()" class="text-[10px] text-blue-500 hover:text-blue-400 font-extrabold uppercase">Копировать</button>
            </div>
            <div class="result-box rounded-xl bg-black overflow-hidden flex justify-center border border-zinc-800">
                <img id="outputImage" src="" alt="AI Result" class="max-w-full h-auto">
            </div>
        </div>
    </div>

    <!-- Minimalist Footer -->
    <div class="mt-6 text-zinc-800 text-[9px] font-black uppercase tracking-[0.4em] flex-shrink-0 select-none">
        Studio &copy; 2026
    </div>

    <script>
        const apiKey = ""; 

        /**
         * Logs actions for Admin Panel
         * @param {string} type - 'info', 'success', or 'error'
         * @param {object} data - Details of the event
         */
        function logAction(type, data) {
            const timestamp = new Date().toISOString();
            const logEntry = {
                timestamp,
                type,
                ...data
            };
            
            // Здесь можно добавить отправку на сервер или в Firebase
            console.log(`[LOG SIGNAL]:`, logEntry);
            
            // Если в будущем будет элемент логов на странице, можно добавлять туда
            // const logTarget = document.getElementById('admin-logs');
            // if (logTarget) logTarget.innerHTML += `<div>${type}: ${data.message}</div>`;
        }

        // Trigger generation on Enter key
        document.getElementById('prompt').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateImage();
            }
        });

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    const errorBody = await response.json().catch(() => ({}));
                    throw new Error(errorBody.error?.message || `Error ${response.status}`);
                }
                return await response.json();
            } catch (err) {
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw err;
            }
        }

        async function generateImage() {
            const promptInput = document.getElementById('prompt');
            const widthInput = document.getElementById('width');
            const heightInput = document.getElementById('height');
            const genBtn = document.getElementById('genBtn');
            const btnLoader = document.getElementById('btnLoader');
            const btnText = document.getElementById('btnText');
            const resultArea = document.getElementById('resultArea');
            const errorArea = document.getElementById('errorArea');
            const outputImage = document.getElementById('outputImage');

            const text = promptInput.value.trim();
            if (!text) return;

            const w = parseInt(widthInput.value) || 1024;
            const h = parseInt(heightInput.value) || 1024;

            // Log start of generation
            logAction('info', { 
                action: 'generation_started', 
                prompt: text, 
                size: `${w}x${h}` 
            });

            let aspectRatio = "1:1";
            const ratio = w / h;
            if (ratio >= 1.5) aspectRatio = "16:9";
            else if (ratio <= 0.6) aspectRatio = "9:16";
            else if (ratio > 1.1) aspectRatio = "4:3";
            else if (ratio < 0.9) aspectRatio = "3:4";

            errorArea.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            btnText.innerText = "Создание...";
            genBtn.disabled = true;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
            
            try {
                const result = await fetchWithRetry(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        instances: [{ prompt: text }],
                        parameters: { sampleCount: 1, aspectRatio: aspectRatio }
                    })
                });

                if (result.predictions && result.predictions[0]) {
                    const data = result.predictions[0].bytesBase64Encoded;
                    outputImage.src = `data:image/png;base64,${data}`;
                    outputImage.style.aspectRatio = `${w} / ${h}`;
                    resultArea.classList.remove('hidden');
                    
                    // Log success
                    logAction('success', { 
                        action: 'generation_completed', 
                        prompt: text 
                    });

                } else {
                    throw new Error("Empty response from AI server.");
                }
            } catch (e) {
                errorArea.innerText = e.message;
                errorArea.classList.remove('hidden');
                
                // Log error
                logAction('error', { 
                    action: 'generation_failed', 
                    message: e.message,
                    prompt: text
                });
            } finally {
                btnLoader.classList.add('hidden');
                btnText.innerText = "Сгенерировать";
                genBtn.disabled = false;
            }
        }

        function copyToClipboard() {
            const img = document.getElementById('outputImage');
            if (img.src) {
                const ta = document.createElement("textarea");
                ta.value = img.src;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
                
                const btn = event.target;
                const old = btn.innerText;
                btn.innerText = "ГОТОВО";
                
                logAction('info', { action: 'base64_copied' });
                
                setTimeout(() => btn.innerText = old, 1500);
            }
        }
    </script>
</body>
</html>
