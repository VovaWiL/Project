<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Проекты</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 48px;
            margin: 0;
            color: #000;
        }

        header p {
            font-size: 18px;
            color: #666;
        }

        /* Сетка проектов */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 колонки как на картинке */
            gap: 20px;
            max-width: 1100px;
            width: 90%;
            padding-bottom: 50px;
        }

        /* Стиль карточки */
        .project-card {
            aspect-ratio: 16 / 9; /* Соотношение сторон как у карточек Neal.fun */
            border: 2px solid #000;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease;
            text-decoration: none;
            display: block;
        }

        .project-card:hover {
            transform: scale(1.02);
        }

        /* Картинка на весь фон карточки */
        .project-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Заголовок внутри карточки (если нужно) */
        .project-title {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            text-align: center;
            padding: 10px 0;
            font-weight: bold;
            font-size: 20px;
            border-top: 2px solid #000;
        }

        /* Адаптивность для телефонов */
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>МОИ ПРОЕКТЫ</h1>
        <p>Нажми на проект, чтобы открыть</p>
    </header>

    <div class="grid">
        
        <!-- Карточка твоего мессенджера -->
        <a href="https://timate.ru/download" class="project-card">
            <!-- Здесь вставь прямую ссылку на фото с буквой T или само фото -->
            <img src="t_logo.png" alt="TIMATE Messenger">
            <div class="project-title">TIMATE</div>
        </a>

        <!-- Заглушки для твоих будущих проектов (просто скопируй этот блок) -->
        <a href="#" class="project-card">
            <img src="https://via.placeholder.com/600x400?text=Project+2" alt="Проект 2">
            <div class="project-title">Project Name</div>
        </a>

        <a href="#" class="project-card">
            <img src="https://via.placeholder.com/600x400?text=Project+3" alt="Проект 3">
            <div class="project-title">Project Name</div>
        </a>

    </div>

</body>
</html>
