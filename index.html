<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Проекты</title>
    <style>
        /* Стиль фона как у TIMATE */
        body {
            /* Используем градиент, похожий на стиль твоего логотипа */
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 50px;
            color: #fff;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 48px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1100px;
            width: 90%;
            padding-bottom: 50px;
        }

        /* Карточка с эффектом стекла (Glassmorphism) */
        .project-card {
            aspect-ratio: 16 / 9;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .project-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        }

        /* Картинка проекта */
        .project-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Название проекта снизу */
        .project-title {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            color: #1d350c; /* Темно-зеленый под стиль TIMATE */
            text-align: center;
            padding: 12px 0;
            font-weight: bold;
            font-size: 18px;
        }

        /* Адаптация под мобилки */
        @media (max-width: 600px) {
            header h1 { font-size: 32px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Мои Проекты</h1>
        <p>Нажми на проект, чтобы перейти</p>
    </header>

    <div class="grid">
        
        <!-- Карточка TIMATE -->
        <a href="https://timate.ru/download" class="project-card">
            <!-- Ссылка на твою картинку в корне GitHub -->
            <img src="TimateLogo.jpg" alt="TIMATE Messenger">
            <div class="project-title">TIMATE</div>
        </a>

        <!-- Место для других проектов -->
        <!-- Просто добавь такие же блоки ниже, когда будут новые проекты -->

    </div>

</body>
</html>
