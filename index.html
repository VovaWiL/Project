<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Проекты</title>
    <style>
        /* Точный фон как на скриншоте TIMATE */
        body {
            background: linear-gradient(135deg, #e1f58d 0%, #a2e891 50%, #87dfa4 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 60px;
            color: #1d350c;
        }

        header h1 {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #1a1a1a;
            letter-spacing: -1px;
        }

        header p {
            font-size: 18px;
            margin-bottom: 50px;
            opacity: 0.8;
        }

        /* Сетка проектов */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, 180px);
            gap: 25px;
            justify-content: center;
            max-width: 1100px;
            width: 90%;
        }

        /* Квадратные карточки с мягким стеклом */
        .project-card {
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 32px; /* Увеличенное скругление для мягкости */
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .project-card:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 45px rgba(0,0,0,0.1);
        }

        .project-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Подпись проекта */
        .project-title {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            text-align: center;
            padding: 12px 0;
            font-weight: 700;
            font-size: 15px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        /* Подвал */
        footer {
            margin-top: auto;
            padding: 40px;
            font-size: 14px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <header>
        <h1>TIMATE</h1>
        <p>Мои проекты и разработки</p>
    </header>

    <div class="grid">
        
        <!-- Карточка Мессенджера -->
        <a href="https://timate.ru/download" class="project-card">
            <img src="TimateLogo.jpg" alt="TIMATE">
            <div class="project-title">TIMATE</div>
        </a>

        <!-- Проект Snake RTX -->
        <a href="https://timate.ru/snake-rtx" class="project-card">
            <img src="snakertxicon.png" alt="Snake RTX">
            <div class="project-title">Snake RTX</div>
        </a>

    </div>

    <footer>
        © 2026 TIMATE. Все права защищены.
    </footer>

</body>
</html>
<meta property="og:title" content="TIMATE - Проекты">
<meta property="og:description" content="Все мои проекты тут TIMATE">
<meta property="og:image" content="favicon.ico">
<meta property="og:url" content="https://timate.ru">
